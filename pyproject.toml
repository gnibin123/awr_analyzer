[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awr-analyzer"
version = "0.1.0"
description = "Standalone tool to analyze Oracle AWR reports and produce plain-language, actionable performance insights and trend forecasts."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "awr-analyzer contributors" }]
dependencies = [
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
awr-analyzer = "awr_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["awr_analyzer*"]
